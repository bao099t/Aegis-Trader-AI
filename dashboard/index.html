<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Trader AI | Institutional Dashboard</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-color: #05070a;
            --panel-bg: rgba(16, 20, 24, 0.8);
            --accent-blue: #00d2ff;
            --accent-gold: #ffc107;
            --text-main: #e0e0e0;
            --success-green: #00ffa3;
            --danger-red: #ff4d4d;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow-x: hidden;
        }

        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
        }

        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-family: 'Orbitron', sans-serif;
            font-size: 24px;
            font-weight: 700;
            background: linear-gradient(90deg, var(--accent-blue), #9d50bb);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px 40px;
        }

        .stat-card {
            padding: 24px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 210, 255, 0.15);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin: 10px 0;
            font-family: 'Orbitron', sans-serif;
        }

        .stat-label {
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
        }

        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            padding: 0 40px 40px 40px;
        }

        .chart-box {
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .chart-placeholder {
            width: 90%;
            height: 70%;
            background: linear-gradient(180deg, rgba(0, 210, 255, 0.05) 0%, transparent 100%);
            border-bottom: 2px solid var(--accent-blue);
            position: relative;
        }

        .log-box {
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 13px;
        }

        .log-entry {
            margin-bottom: 8px;
            border-left: 2px solid var(--accent-blue);
            padding-left: 10px;
        }

        .status-badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .status-active {
            background: rgba(0, 255, 163, 0.15);
            color: var(--success-green);
        }

        /* Animations */
        @keyframes pulse {
            0% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }

            100% {
                opacity: 0.6;
            }
        }

        .pulse {
            animation: pulse 2s infinite ease-in-out;
        }
    </style>
</head>

<body>
    <header>
        <div class="logo">AEGIS TRADER AI</div>
        <div class="nav">
            <span class="status-badge status-active pulse">● LIVE: Institutional Mode</span>
        </div>
    </header>

    <div class="stats-grid">
        <div class="stat-card glass">
            <div class="stat-label">System Latency</div>
            <div id="latency" class="stat-value" style="color: var(--accent-blue);">-- ms</div>
            <div class="stat-label">Real-time Heartbeat</div>
        </div>
        <div class="stat-card glass">
            <div class="stat-label">Guardian Status</div>
            <div id="guardian-status" class="stat-value" style="color: var(--accent-gold);">initializing...</div>
            <div class="stat-label">Risk Protocol</div>
        </div>
        <div class="stat-card glass">
            <div class="stat-label">Active Trades</div>
            <div class="stat-value">0</div>
            <div class="stat-label">Live Positions</div>
        </div>
        <div class="stat-card glass">
            <div class="stat-label">Today's PnL</div>
            <div class="stat-value" style="color: var(--success-green);">$0.00</div>
            <div class="stat-label">Unrealized Profit</div>
        </div>
    </div>

    <div class="main-content">
        <div class="chart-box glass">
            <div style="position: absolute; top: 20px; left: 20px; font-weight: 600;">EOUATION Live</div>
            <div class="chart-placeholder">
                <!-- SVG Chart Mockup -->
                <svg width="100%" height="100%" viewBox="0 0 1000 300">
                    <path
                        d="M0,280 L100,270 L200,250 L300,200 L400,180 L500,140 L600,100 L700,80 L800,50 L900,30 L1000,10"
                        fill="none" stroke="url(#lineGradient)" stroke-width="4" />
                    <defs>
                        <linearGradient id="lineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
                            <stop offset="0%" style="stop-color:var(--accent-blue);stop-opacity:1" />
                            <stop offset="100%" style="stop-color:#9d50bb;stop-opacity:1" />
                        </linearGradient>
                    </defs>
                </svg>
            </div>
        </div>
        <div class="log-box glass" id="log-container">
            <div class="log-entry" style="color: #888;">Waiting for system logs...</div>
        </div>
    </div>

    <!-- Dynamic Data Loading -->
    <script>
        const API_URL = "http://localhost:8000";

        async function updateDashboard() {
            try {
                // 1. Fetch Status
                const statusRes = await fetch(`${API_URL}/status`);
                const statusData = await statusRes.json();

                if (statusData.status) {
                    document.getElementById('guardian-status').innerText = statusData.guardian_status || "UNKNOWN";
                    document.getElementById('latency').innerText = `${statusData.latency_ms} ms`;
                }

                // 2. Fetch Logs
                const logsRes = await fetch(`${API_URL}/logs?lines=10`);
                const logsData = await logsRes.json();

                const logBox = document.getElementById('log-container');
                logBox.innerHTML = logsData.map(line => `<div class="log-entry">${line}</div>`).join('');
                logBox.scrollTop = logBox.scrollHeight;

            } catch (e) {
                console.error("Dashboard Sync Error, check if server.py is running:", e);
                document.getElementById('latency').innerText = "DISCONNECTED";
                document.getElementById('latency').style.color = "var(--danger-red)";
            }
        }

        // Initialize
        setInterval(updateDashboard, 2000);
        updateDashboard();
    </script>
</body>

</html>
