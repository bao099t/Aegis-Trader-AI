version: '3.8'

services:
  bot:
    build: .
    container_name: aegis_bot
    restart: always
    environment:
      - TRADING_MODE=PAPER
      - EXECUTION_TYPE=DYNAMIC
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    ports:
      - "8000:8000"
    command: python src/main.py

  dashboard:
    image: node:18-alpine
    container_name: aegis_dashboard
    working_dir: /app
    volumes:
      - ./dashboard:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - bot
